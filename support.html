
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="pictures/favicon.jpg">
</head>
<body style="background-color: cadetblue;">
        <header>
            <div class="wrapper">
                <span class="icon-close"><ion-icon name="close-circle-outline"></ion-icon></span>
                <div class="form-box login">
                <h2>Login</h2>
                <form action="#">
                    <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" required>
                    <label>Email</label>
                    </div>
                    <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></ion-icon></span>
                    <input type="password" required>
                    <label>Password</label>
                    </div>

                    <div class="remember-fogrot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn">Login</button>
                    <div class="login-register">
                    <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
                    </div>
                </form>
                </div>
                      <div class="form-box register">
                        <h2>Registration</h2>
                        <form action="#">
                            <div class="input-box">
                            <span class="icon"><ion-icon name="person"></ion-icon></span>
                            <input type="text" required>
                            <label>Username</label>
                            </div>
                            <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed"></ion-icon></ion-icon></span>
                            <input type="password" required>
                            <label>Password</label>
                            </div> 
                            <div class="input-box">
                            <span class="icon"><ion-icon name="mail"></ion-icon></span>
                            <input type="email" required>
                            <label>Email</label>
                            </div>
                            <div class="remember-fogrot">
                            <label><input type="checkbox"> I agree to the terms & conditions</label>
                            <a href="#"></a>
                            </div>

                            <button type="submit" class="btn">Register</button>
                            <div class="login-register">
                                <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                            </div>
                       </form>
                    </div>
            </div>
            <script src="index.js"></script>
            <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    </header>
    <h1 class="support__h1">Support</h1>
    <p class="support__p">ТУТ БУДЕ ІНФОРМАЦІЯ ПРО ПІДТРИМКУ КЛІЄНТІВ</p>    
</body>
</html>
